  <script>
    (function () {
      var FID = "05-embed";
      var scope = '[data-composition-id="05-embed"] ';
      var q = function (s) { return document.querySelector(scope + s); };
      var qa = function (s) { return document.querySelectorAll(scope + s); };

      // ---- build the typed snippet (deterministic, synchronous) ----
      var tokens = [
        ["t", "<iframe "],
        ["a", "src"],
        ["t", "="],
        ["v", "\"https://growthmath.io/embed/roas-calculator/\""],
        ["t", "></iframe>"]
      ];
      var codeEl = q(".fr05-embed-code");
      var chars = [];
      tokens.forEach(function (tk) {
        for (var i = 0; i < tk[1].length; i++) {
          var s = document.createElement("span");
          s.className = tk[0];
          s.textContent = tk[1][i];
          s.style.display = "none";
          codeEl.appendChild(s);
          chars.push(s);
        }
      });

      // page coordinates (root space) for cursor targeting
      // page left 120 + inner 56 = 176 ; page top 104 + inner 54 = 158 ; slot top +296 = 454
      var SLOT_X = 176, SLOT_Y = 454;
      var CHIP_CX = SLOT_X + 640, CHIP_CY = SLOT_Y + 43;

      var tl = gsap.timeline({ paused: true });

      // ---------- macro camera: slow push toward the post ----------
      tl.fromTo(q(".fr05-embed-world"), { scale: 1, transformOrigin: "38% 50%" },
        { scale: 1.035, duration: 5.5, ease: "none" }, 0);

      // ---------- Scene 1 (0.0-1.4): page + first caption ----------
      tl.fromTo(q(".fr05-embed-page"), { y: 40, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 0);
      tl.fromTo(q(".fr05-embed-tag"), { y: 12, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.35, ease: "power2.out" }, 0.18);
      tl.fromTo(q(".fr05-embed-title"), { y: 18, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, 0.24);
      tl.fromTo(qa(".fr05-embed-pl"), { scaleX: 0, transformOrigin: "0% 50%" },
        { scaleX: 1, duration: 0.45, ease: "power2.out", stagger: 0.07 }, 0.42);
      tl.fromTo(q(".fr05-embed-tail"), { opacity: 0 },
        { opacity: 1, duration: 0.4, ease: "power1.out" }, 0.62);

      tl.fromTo(q(".fr05-embed-accent"), { scaleX: 0 },
        { scaleX: 1, duration: 0.4, ease: "power3.out" }, 0.35);
      tl.fromTo(qa(".fr05-embed-cap-1 .w"), { y: 40, opacity: 0, filter: "blur(8px)" },
        { y: 0, opacity: 1, filter: "blur(0px)", duration: 0.5, ease: "power3.out", stagger: 0.08 }, 0.45);

      // ---------- Scene 2 (1.4-2.8): caption swap + chip + typing ----------
      tl.to(qa(".fr05-embed-cap-1 .w"), { x: -30, opacity: 0, filter: "blur(10px)",
        duration: 0.28, ease: "power2.in", stagger: 0.04 }, 1.4);
      tl.fromTo(qa(".fr05-embed-cap-2 .w"), { x: 40, opacity: 0, filter: "blur(10px)" },
        { x: 0, opacity: 1, filter: "blur(0px)", duration: 0.45, ease: "power3.out", stagger: 0.06 }, 1.58);

      // chip enters, trailing paragraph reflows down
      tl.fromTo(q(".fr05-embed-chip"), { scaleY: 0.4, opacity: 0 },
        { scaleY: 1, opacity: 1, duration: 0.35, ease: "back.out(1.6)" }, 1.5);
      tl.fromTo(q(".fr05-embed-tail"), { y: 0 },
        { y: 110, duration: 0.4, ease: "power3.out" }, 1.5);

      // typing 1.85 -> ~2.75
      var typeStart = 1.85, step = 0.0135;
      chars.forEach(function (c, i) {
        tl.set(c, { display: "inline" }, typeStart + i * step);
      });
      var typeEnd = typeStart + chars.length * step;
      var caret = q(".fr05-embed-caret");
      tl.set(caret, { opacity: 0 }, typeEnd + 0.12);
      tl.set(caret, { opacity: 1 }, typeEnd + 0.3);

      // ---------- Scene 3 (2.8-4.2): cursor click -> widget ----------
      var cursor = q(".fr05-embed-cursor");
      tl.fromTo(cursor, { x: 1060, y: 980, opacity: 0, scale: 1 },
        { x: 1000, y: 860, opacity: 1, duration: 0.2, ease: "power1.out" }, 2.6);
      tl.to(cursor, { x: CHIP_CX - 6, y: CHIP_CY - 4, duration: 0.42, ease: "power3.inOut" }, 2.8);
      // press
      tl.to(cursor, { scale: 0.82, duration: 0.08, ease: "power2.in" }, 3.22);
      tl.to(cursor, { scale: 1, duration: 0.22, ease: "back.out(3)" }, 3.30);
      tl.to(q(".fr05-embed-chip"), { scale: 0.97, duration: 0.08, ease: "power2.in" }, 3.22);
      tl.set(caret, { opacity: 0 }, 3.22);
      var ripple = q(".fr05-embed-ripple");
      tl.fromTo(ripple, { x: CHIP_CX - SLOT_X, y: CHIP_CY - SLOT_Y, scale: 0.2, opacity: 0 },
        { opacity: 0.9, duration: 0.03, ease: "none" }, 3.24);
      tl.to(ripple, { scale: 1.6, opacity: 0, duration: 0.45, ease: "power2.out" }, 3.27);

      // chip collapses
      tl.to(q(".fr05-embed-chip"), { scaleY: 0.05, scaleX: 0.98, opacity: 0, duration: 0.22, ease: "power3.in" }, 3.32);
      // widget expands in its place
      tl.fromTo(q(".fr05-embed-widget"), { scaleY: 0.27, scaleX: 0.98, opacity: 0 },
        { scaleY: 1, scaleX: 1, opacity: 1, duration: 0.5, ease: "power3.out" }, 3.44);
      tl.fromTo(q(".fr05-embed-tail"), { y: 110 },
        { y: 350, duration: 0.5, ease: "power3.out", immediateRender: false }, 3.44);
      tl.fromTo(qa(".fr05-embed-field"), { opacity: 0, x: -14 },
        { opacity: 1, x: 0, duration: 0.3, ease: "power2.out", stagger: 0.06 }, 3.62);
      tl.fromTo(q(".fr05-embed-result-num"), { scale: 0.6, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.5, ease: "back.out(2.2)" }, 3.78);
      tl.fromTo(q(".fr05-embed-credit"), { y: 10, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.35, ease: "power2.out" }, 3.95);
      // cursor drifts off the widget to rest
      tl.to(cursor, { x: 1090, y: 700, duration: 0.6, ease: "power2.inOut" }, 3.7);

      // ---------- Scene 4 (4.2-5.5): second caption line rises; hold ----------
      tl.fromTo(qa(".fr05-embed-cap-b .w"), { y: 50, opacity: 0, filter: "blur(8px)" },
        { y: 0, opacity: 1, filter: "blur(0px)", duration: 0.5, ease: "power3.out", stagger: 0.07 }, 4.25);

      window.__timelines = window.__timelines || {};
      window.__timelines[FID] = tl;
    })();
