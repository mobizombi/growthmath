        // Caret windows: [focus-in, focus-out, last keystroke]
        var CAR = [
          { el: c1, a: 0.98, b: 1.46, last: 1.30 },
          { el: c2, a: 1.48, b: 1.98, last: 1.80 },
          { el: c3, a: 2.00, b: 2.60, last: 2.24 }

        function stateAt(seq, t) {
          for (var i = seq.length - 1; i >= 0; i--) if (t >= seq[i].t) return seq[i].s;
          return "";

        function clamp01(x) { return x < 0 ? 0 : x > 1 ? 1 : x; }
        function easeOut(x) { return 1 - Math.pow(1 - x, 3); }
        function prog(t, a, b) { return easeOut(clamp01((t - a) / (b - a))); }

        function render(t) {
          v1.textContent = stateAt(SEQ1, t);
          v2.textContent = stateAt(SEQ2, t);
          v3.textContent = stateAt(SEQ3, t);
          for (var i = 0; i < CAR.length; i++) {

              on = t <= c.last + 0.12 ? 1 : (Math.floor((t - c.last) / 0.22) % 2 === 0 ? 0 : 1);

          }
