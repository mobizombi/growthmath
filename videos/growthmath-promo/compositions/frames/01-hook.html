      const tl = gsap.timeline({ paused: true });

      const numEl = document.getElementById("hook01-num");
      const counter = { v: 0 };
      function renderNum() {
        // Deterministic: derived only from the tweened proxy value.
        numEl.textContent = counter.v >= 3 ? "3x." : counter.v.toFixed(1) + "x";

      renderNum();

      // ---- Scene 1 (0.0-1.3s): "Your ROAS is" slides up, "3x." counts in ----

      // landing punch on the final value
      tl.fromTo("#hook01-num", { scale: 1 }, { scale: 1.08, duration: 0.1, ease: "power2.out", immediateRender: false }, 0.95);

      tl.set("#hook01-lineA", { opacity: 0 }, 1.3);

      // "?" pulses once in green
