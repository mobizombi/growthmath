<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #F7F6F2;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="28"
      data-width="1920"
      data-height="1080"
    >
      <div
        id="el-01-hook"
        class="scene"
        data-composition-id="01-hook"
        data-composition-src="compositions/frames/01-hook.html"
        data-start="0"
        data-duration="4"
        data-track-index="0"
      ></div>

      <div
        id="el-02-intro"
        class="scene"
        data-composition-id="02-intro"
        data-composition-src="compositions/frames/02-intro.html"
        data-start="3.5"
        data-duration="4"
        data-track-index="1"
      ></div>

      <div
        id="el-03-roas-demo"
        class="scene"
        data-composition-id="03-roas-demo"
        data-composition-src="compositions/frames/03-roas-demo.html"
        data-start="7"
        data-duration="7"
        data-track-index="0"
      ></div>

      <div
        id="el-04-tool-grid"
        class="scene"
        data-composition-id="04-tool-grid"
        data-composition-src="compositions/frames/04-tool-grid.html"
        data-start="13.5"
        data-duration="5.5"
        data-track-index="1"
      ></div>

      <div
        id="el-05-embed"
        class="scene"
        data-composition-id="05-embed"
        data-composition-src="compositions/frames/05-embed.html"
        data-start="18.5"
        data-duration="6"
        data-track-index="0"
      ></div>

      <div
        id="el-06-cta"
        class="scene"
        data-composition-id="06-cta"
        data-composition-src="compositions/frames/06-cta.html"
        data-start="24"
        data-duration="4"
        data-track-index="1"
      ></div>

      <!-- BGM -->
      <audio
        id="el-bgm"
        src="assets/bgm/track.mp3"
        data-start="0"
        data-duration="28"
        data-track-index="11"
        data-volume="0.8"
      ></audio>

    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      // ── frame transitions (injected by transitions.mjs) ──
      (function () { var tl = window.__timelines["main"];
        tl.to("#el-01-hook", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 3.5);
        tl.fromTo("#el-02-intro", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 3.5);
        tl.to("#el-02-intro", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 7);
        tl.fromTo("#el-03-roas-demo", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 7);
        tl.to("#el-03-roas-demo", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 13.5);
        tl.fromTo("#el-04-tool-grid", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 13.5);
        tl.to("#el-04-tool-grid", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 18.5);
        tl.fromTo("#el-05-embed", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 18.5);
        tl.to("#el-05-embed", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 24);
        tl.fromTo("#el-06-cta", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 24);
        tl.to({}, { duration: 28 }, 0); // full-span anchor — main.duration() == composition total (Studio master duration)
      })();
    </script>
  </body>
</html>
