<div class="inp"><input id="clicks" type="text" inputmode="decimal" value="2000" autocomplete="off"></div>
</div>

<div class="field"><label for="cvr">Conversion rate</label>
<div class="inp has-suf"><input id="cvr" type="text" inputmode="decimal" value="3" autocomplete="off"><span class="suf">%</span></div>

<div class="field"><label for="com">Commission</label>
<div class="inp has-suf"><input id="com" type="text" inputmode="decimal" value="30" autocomplete="off"><span class="suf">%</span></div>
</div></div>

<div class="field"><label for="flat">Or flat CPA payout per sale</label>
<div class="inp has-pre"><span class="pre">$</span><input id="flat" type="text" inputmode="decimal" value="" autocomplete="off"></div>

</div>

<script>new URLSearchParams(location.search).forEach(function(v,k){var el=document.getElementById(k);if(el&&/^(INPUT|SELECT)$/.test(el.tagName)&&el.type!=='file')el.value=String(v).slice(0,40);});</script>
<script>live(() => {
  const c = num('clicks'), cvr = num('cvr') / 100, aov = num('aov'), com = num('com') / 100, flat = num('flat'), goal = num('goal');
  const per = ok(flat) && flat > 0 ? flat : aov * com;
  if (!ok(c, cvr, per)) return;
  const sales = c * cvr, earn = sales * per, epc = cvr * per;
  set('o_earn', money(earn)); set('o_epc', money(epc)); set('o_sales', fnum(sales, 1)); set('o_per', money(per));
  set('o_need', ok(goal) && epc > 0 ? fnum(Math.ceil(goal / epc), 0) : '-');
});</script>
