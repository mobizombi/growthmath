</head><body class="embed">
<section class="tool"><div>
<div class="row2">
<div class="field"><label for="vis">Visitors (sessions)</label>
<div class="inp"><input id="vis" type="text" inputmode="decimal" value="20000" autocomplete="off"></div>
</div>
<div class="field"><label for="conv">Conversions (orders, leads)</label>
<div class="inp"><input id="conv" type="text" inputmode="decimal" value="400" autocomplete="off"></div>
</div></div>
<div class="row2">
<div class="field"><label for="aov">Average value per conversion</label>
<div class="inp has-pre"><span class="pre">$</span><input id="aov" type="text" inputmode="decimal" value="75" autocomplete="off"></div>
</div>
<div class="field"><label for="target">Target conversion rate</label>
<div class="inp has-suf"><input id="target" type="text" inputmode="decimal" value="2.5" autocomplete="off"><span class="suf">%</span></div>
</div></div>
</div>
<div class="out">
<div class="big-label">Conversion rate</div><div class="big" id="o_cvr">-</div>
<div class="stats"><div class="stat"><span>Revenue per visitor</span><strong id="o_rpv">-</strong></div><div class="stat"><span>Revenue now</span><strong id="o_rev">-</strong></div><div class="stat"><span>Revenue at target rate</span><strong id="o_trev">-</strong></div><div class="stat"><span>Extra revenue at target</span><strong id="o_gain">-</strong></div></div>
<div class="verdict" id="o_v"></div></div></section>
<div class="embed-foot"><a href="https://growthmath.io/conversion-rate-calculator/" target="_blank" rel="noopener"><span class="logo-mark">g/m</span> Conversion Rate Calculator</a><a href="https://growthmath.io/conversion-rate-calculator/" target="_blank" rel="noopener">Formula and guide</a></div>
<script src="/app.js"></script>
<script>new URLSearchParams(location.search).forEach(function(v,k){var el=document.getElementById(k);if(el&&/^(INPUT|SELECT)$/.test(el.tagName)&&el.type!=='file')el.value=String(v).slice(0,40);});</script>
<script>live(() => {
  const v = num('vis'), c = num('conv'), a = num('aov'), t = num('target') / 100;
  if (!ok(v, c) || v <= 0) return;
  if (c > v) { set('o_v', 'Conversions cannot be higher than visitors - count each visitor once.'); return; }
  const cvr = c / v;
  set('o_cvr', pct(cvr * 100, 2));
  if (!ok(a)) return;
  set('o_rpv', money(c * a / v)); set('o_rev', money(c * a));
  if (!ok(t) || t <= 0 || t > 1) return;
  const tr = v * t * a, gain = tr - c * a;
  set('o_trev', money(tr)); set('o_gain', money(gain));
  set('o_v', gain > 0 ? 'Raising conversion from ' + pct(cvr * 100, 2) + ' to ' + pct(t * 100, 2) + ' adds ' + money(gain) + ' with the same traffic - that is ' + fnum(Math.round(gain / a), 0) + ' more conversions, no extra ad spend.' : 'You are already at or above this target rate.');
});</script>
