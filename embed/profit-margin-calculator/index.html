<section class="tool"><div>

<div class="field"><label for="cost">Cost</label>
<div class="inp has-pre"><span class="pre">$</span><input id="cost" type="text" inputmode="decimal" value="40" autocomplete="off"></div>
</div>

<div class="field"><label for="price">Selling price</label>
<div class="inp has-pre"><span class="pre">$</span><input id="price" type="text" inputmode="decimal" value="100" autocomplete="off"></div>
</div>
<hr style="border:0;border-top:1px solid var(--line);margin:18px 0">

<div class="field"><label for="tm">Target margin (optional)</label>
<div class="inp has-suf"><input id="tm" type="text" inputmode="decimal" value="50" autocomplete="off"><span class="suf">%</span></div>

</div>
<div class="out">
<div class="big-label">Gross margin</div><div class="big" id="o_m">-</div>
<div class="stats"><div class="stat"><span>Markup</span><strong id="o_mu">-</strong></div><div class="stat"><span>Profit per unit</span><strong id="o_p">-</strong></div><div class="stat"><span>Price for target margin</span><strong id="o_tp">-</strong></div><div class="stat"><span>Markup for target margin</span><strong id="o_tmu">-</strong></div></div>
</div></section>

<script>new URLSearchParams(location.search).forEach(function(v,k){var el=document.getElementById(k);if(el&&/^(INPUT|SELECT)$/.test(el.tagName)&&el.type!=='file')el.value=String(v).slice(0,40);});</script>
<script>live(() => {
  const c = num('cost'), p = num('price'), tm = num('tm') / 100;
  if (ok(c, p) && p > 0) { set('o_m', pct((p - c) / p * 100)); set('o_mu', c > 0 ? pct((p - c) / c * 100) : '-'); set('o_p', money(p - c)); $('o_m').classList.toggle('bad', p < c); }
  if (ok(c, tm) && tm < 1) { set('o_tp', money(c / (1 - tm))); set('o_tmu', pct(tm / (1 - tm) * 100)); } else { set('o_tp', '-'); set('o_tmu', '-'); }
});</script>
