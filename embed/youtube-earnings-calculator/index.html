</head><body class="embed">
<section class="tool"><div>
<div class="row2">
<div class="field"><label for="views">Views per month</label>
<div class="inp"><input id="views" type="text" inputmode="decimal" value="200000" autocomplete="off"></div>
</div>
<div class="field"><label for="rpm">RPM (revenue per 1,000 views)</label>
<div class="inp has-pre"><span class="pre">$</span><input id="rpm" type="text" inputmode="decimal" value="4" autocomplete="off"></div>
<div class="hint">Find it in YouTube Studio - Analytics - Revenue.</div></div></div>
<div class="row2">
<div class="field"><label for="sp">Sponsored videos per month</label>
<div class="inp"><input id="sp" type="text" inputmode="decimal" value="1" autocomplete="off"></div>
</div>
<div class="field"><label for="rate">Average fee per sponsorship</label>
<div class="inp has-pre"><span class="pre">$</span><input id="rate" type="text" inputmode="decimal" value="800" autocomplete="off"></div>
</div></div>
</div>
<div class="out">
<div class="big-label">Estimated monthly ad revenue</div><div class="big" id="o_ad">-</div>
<div class="stats"><div class="stat"><span>Ad revenue per year</span><strong id="o_year">-</strong></div><div class="stat"><span>Monthly total with sponsors</span><strong id="o_total">-</strong></div><div class="stat"><span>Effective earnings per 1,000 views</span><strong id="o_eff">-</strong></div><div class="stat"><span>Range at RPM -50% / +50%</span><strong id="o_low">-</strong></div></div>
<div class="verdict" id="o_v"></div></div></section>
<div class="embed-foot"><a href="https://growthmath.io/youtube-earnings-calculator/" target="_blank" rel="noopener"><span class="logo-mark">g/m</span> YouTube Earnings Calculator</a><a href="https://growthmath.io/youtube-earnings-calculator/" target="_blank" rel="noopener">Formula and guide</a></div>
<script src="/app.js"></script>
<script>new URLSearchParams(location.search).forEach(function(v,k){var el=document.getElementById(k);if(el&&/^(INPUT|SELECT)$/.test(el.tagName)&&el.type!=='file')el.value=String(v).slice(0,40);});</script>
<script>live(() => {
  const v = num('views'), r = num('rpm'), sp0 = num('sp'), rate0 = num('rate');
  if (!ok(v, r)) return;
  const ad = v / 1000 * r, spon = (ok(sp0) ? sp0 : 0) * (ok(rate0) ? rate0 : 0), tot = ad + spon;
  set('o_ad', money(ad)); set('o_year', money(ad * 12)); set('o_total', money(tot));
  set('o_eff', v > 0 ? money(tot / v * 1000) : '-');
  set('o_low', money(ad * 0.5, 0) + ' - ' + money(ad * 1.5, 0));
  set('o_v', v > 0 && spon > ad ? 'Sponsorships earn more than ads here - common for channels in niches with a clear buyer audience.' : 'Ad revenue swings with season and audience; treat this as an estimate, not a forecast.');
});</script>
