<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Customer Lifetime Value (LTV) Calculator - GrowthMath</title>
<meta name="robots" content="noindex,follow"><link rel="canonical" href="https://growthmath.io/customer-ltv-calculator/">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}
gtag('consent','default',{ad_storage:'denied',ad_user_data:'denied',ad_personalization:'denied',analytics_storage:'denied',region:["AT","BE","BG","HR","CY","CZ","DK","EE","FI","FR","DE","GR","HU","IS","IE","IT","LV","LI","LT","LU","MT","NL","NO","PL","PT","RO","SK","SI","ES","SE","GB","CH"],wait_for_update:500});

</head><body class="embed">
<section class="tool"><div>
<div class="row2">
<div class="field"><label for="aov">Average order / monthly fee</label>
<div class="inp has-pre"><span class="pre">$</span><input id="aov" type="text" inputmode="decimal" value="50" autocomplete="off"></div>
</div>
<div class="field"><label for="freq">Purchases per year</label>
<div class="inp"><input id="freq" type="text" inputmode="decimal" value="4" autocomplete="off"></div>
</div></div>
<div class="row2">
<div class="field"><label for="life">Customer lifespan (years)</label>
<div class="inp"><input id="life" type="text" inputmode="decimal" value="2.5" autocomplete="off"></div>
</div>
<div class="field"><label for="gm">Gross margin</label>
<div class="inp has-suf"><input id="gm" type="text" inputmode="decimal" value="60" autocomplete="off"><span class="suf">%</span></div>
</div></div>

<div class="field"><label for="cac">Customer acquisition cost (CAC)</label>
<div class="inp has-pre"><span class="pre">$</span><input id="cac" type="text" inputmode="decimal" value="60" autocomplete="off"></div>
</div>
<p class="small muted">Subscription? Use the monthly fee, 12 purchases per year, and lifespan = 1 / (monthly churn x 12).</p>
</div>
<div class="out">
<div class="big-label">Lifetime value (gross profit)</div><div class="big" id="o_ltv">-</div>
<div class="stats"><div class="stat"><span>Lifetime revenue</span><strong id="o_rev">-</strong></div><div class="stat"><span>LTV : CAC</span><strong id="o_ratio">-</strong></div><div class="stat"><span>CAC payback</span><strong id="o_pay">-</strong></div><div class="stat"><span>Max CAC at 3:1</span><strong id="o_max">-</strong></div></div>
<div class="verdict" id="o_v"></div></div></section>
<div class="embed-foot"><a href="https://growthmath.io/customer-ltv-calculator/" target="_blank" rel="noopener"><span class="logo-mark">g/m</span> Customer Lifetime Value (LTV) Calculator</a><a href="https://growthmath.io/customer-ltv-calculator/" target="_blank" rel="noopener">Formula and guide</a></div>
<script src="/app.js"></script>
<script>new URLSearchParams(location.search).forEach(function(v,k){var el=document.getElementById(k);if(el&&/^(INPUT|SELECT)$/.test(el.tagName)&&el.type!=='file')el.value=String(v).slice(0,40);});</script>
<script>live(() => {
  const aov = num('aov'), fr = num('freq'), life = num('life'), gm = num('gm') / 100, cac = num('cac');
  if (!ok(aov, fr, life, gm)) return;
  const rev = aov * fr * life, ltv = rev * gm, ratio = ltv / cac, monthlyGP = aov * fr * gm / 12;
  set('o_ltv', money(ltv)); set('o_rev', money(rev)); set('o_max', money(ltv / 3));
  set('o_ratio', ok(cac) && cac > 0 ? fnum(ratio, 1) + ' : 1' : '-');
  set('o_pay', ok(cac) && monthlyGP > 0 ? fnum(cac / monthlyGP, 1) + ' months' : '-');
  set('o_v', !ok(ratio) ? '' : ratio < 1 ? 'You lose money on every customer. Fix CAC or retention before scaling.' : ratio < 3 ? 'Below the 3:1 benchmark - profitable, but thin. Improve retention or AOV.' : ratio > 5 ? 'Above 5:1 - you are probably under-investing in growth.' : 'Healthy 3-5:1 ratio. Room to scale.');
});</script>

if(window.ResizeObserver)new ResizeObserver(post).observe(document.body);window.addEventListener('load',post);post();})();</script>
</body></html>
