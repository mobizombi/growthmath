<section class="tool"><div>
<div class="row2">
<div class="field"><label for="likes">Likes (total)</label>
<div class="inp"><input id="likes" type="text" inputmode="decimal" value="4200" autocomplete="off"></div>
</div>
<div class="field"><label for="comments">Comments (total)</label>
<div class="inp"><input id="comments" type="text" inputmode="decimal" value="180" autocomplete="off"></div>
</div></div>
<div class="row2">
<div class="field"><label for="shares">Shares (total)</label>
<div class="inp"><input id="shares" type="text" inputmode="decimal" value="90" autocomplete="off"></div>
</div>
<div class="field"><label for="saves">Saves (total)</label>
<div class="inp"><input id="saves" type="text" inputmode="decimal" value="130" autocomplete="off"></div>
</div></div>
<div class="row2">
<div class="field"><label for="posts">Number of posts</label>
<div class="inp"><input id="posts" type="text" inputmode="decimal" value="5" autocomplete="off"></div>
<div class="hint">How many posts the totals above cover.</div></div>
<div class="field"><label for="followers">Followers</label>
<div class="inp"><input id="followers" type="text" inputmode="decimal" value="50000" autocomplete="off"></div>
</div></div>

<div class="field"><label for="reach">Total reach of those posts (optional)</label>
<div class="inp"><input id="reach" type="text" inputmode="decimal" value="60000" autocomplete="off"></div>
<div class="hint">From your insights. Leave empty if you only have public numbers.</div></div>
</div>
<div class="out">
<div class="big-label">Engagement rate by followers</div><div class="big" id="o_er">-</div>

<div class="verdict" id="o_v"></div></div></section>

<script>new URLSearchParams(location.search).forEach(function(v,k){var el=document.getElementById(k);if(el&&/^(INPUT|SELECT)$/.test(el.tagName)&&el.type!=='file')el.value=String(v).slice(0,40);});</script>
<script>live(() => {
  const l = num('likes'), c = num('comments'), s0 = num('shares'), v0 = num('saves'), n = num('posts'), fol = num('followers'), r = num('reach');
  if (!ok(l, c) || !ok(n) || n <= 0) return;
  const tot = l + c + (ok(s0) ? s0 : 0) + (ok(v0) ? v0 : 0), per = tot / n;
  set('o_avg', fnum(per, 0));
  set('o_cr', l > 0 ? fnum(c / l * 100, 1) : '-');
  if (ok(r) && r > 0) set('o_err', pct(tot / r * 100, 2));
  if (ok(r, fol) && fol > 0 && r > 0) set('o_rf', pct(r / n / fol * 100, 1));
  if (!ok(fol) || fol <= 0) return;
  const er = per / fol * 100;
  set('o_er', pct(er, 2));
  set('o_v', er < 1 ? 'Under 1% is low for most accounts - posts are being seen but not acted on. Test stronger hooks and ask a question people can answer.' : er < 3 ? 'Between 1% and 3% is a solid, typical engagement rate for most accounts.' : er < 6 ? 'Above 3% is strong engagement - a good number to show brands.' : 'Above 6% is exceptional. Common for small or very niche accounts; check that a single viral post is not skewing the average.');
});</script>
