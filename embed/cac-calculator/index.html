<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CAC Calculator - GrowthMath</title>
<meta name="robots" content="noindex,follow"><link rel="canonical" href="https://growthmath.io/cac-calculator/">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}
gtag('consent','default',{ad_storage:'denied',ad_user_data:'denied',ad_personalization:'denied',analytics_storage:'denied',region:["AT","BE","BG","HR","CY","CZ","DK","EE","FI","FR","DE","GR","HU","IS","IE","IT","LV","LI","LT","LU","MT","NL","NO","PL","PT","RO","SK","SI","ES","SE","GB","CH"],wait_for_update:500});
gtag('js',new Date());gtag('config','G-NNNSG3D7ML',{embed_host:document.referrer?new URL(document.referrer).hostname:'direct'});</script>
<script async src="https://www.googletagmanager.com/gtag/js?id=G-NNNSG3D7ML"></script>
</head><body class="embed">
<section class="tool"><div>

<div class="field"><label for="ads">Ad spend in the period</label>
<div class="inp has-pre"><span class="pre">$</span><input id="ads" type="text" inputmode="decimal" value="36000" autocomplete="off"></div>
</div>

<div class="field"><label for="other">Other sales & marketing costs</label>
<div class="inp has-pre"><span class="pre">$</span><input id="other" type="text" inputmode="decimal" value="24000" autocomplete="off"></div>
<div class="hint">Marketing and sales salaries, agencies, tools, content, commissions. Leave 0 for paid CAC only.</div></div>

<div class="field"><label for="cust">New customers in the period</label>
<div class="inp"><input id="cust" type="text" inputmode="decimal" value="400" autocomplete="off"></div>
</div>
<div class="row2">
<div class="field"><label for="mgp">Monthly gross profit per customer</label>
<div class="inp has-pre"><span class="pre">$</span><input id="mgp" type="text" inputmode="decimal" value="41.65" autocomplete="off"></div>
<div class="hint">Optional - for payback.</div></div>
<div class="field"><label for="ltv">Customer lifetime value</label>
<div class="inp has-pre"><span class="pre">$</span><input id="ltv" type="text" inputmode="decimal" value="1388" autocomplete="off"></div>
<div class="hint">Optional - gross-profit LTV.</div></div></div>
</div>
<div class="out">
<div class="big-label">Fully loaded CAC</div><div class="big" id="o_cac">-</div>
<div class="stats"><div class="stat"><span>Paid CAC (ads only)</span><strong id="o_paid">-</strong></div><div class="stat"><span>CAC payback</span><strong id="o_pay">-</strong></div><div class="stat"><span>LTV : CAC</span><strong id="o_ratio">-</strong></div><div class="stat"><span>Max CAC at 3:1</span><strong id="o_max">-</strong></div></div>
<div class="verdict" id="o_v"></div></div></section>
<div class="embed-foot"><a href="https://growthmath.io/cac-calculator/" target="_blank" rel="noopener"><span class="logo-mark">g/m</span> CAC Calculator</a><a href="https://growthmath.io/cac-calculator/" target="_blank" rel="noopener">Formula and guide</a></div>
<script src="/app.js"></script>
<script>new URLSearchParams(location.search).forEach(function(v,k){var el=document.getElementById(k);if(el&&/^(INPUT|SELECT)$/.test(el.tagName)&&el.type!=='file')el.value=String(v).slice(0,40);});</script>
<script>live(() => {
  const a = num('ads'), o0 = num('other'), c = num('cust'), mgp = num('mgp'), ltv = num('ltv');
  if (!ok(a, c) || c <= 0) return;
  const o = ok(o0) ? o0 : 0, full = (a + o) / c, paid = a / c;
  set('o_cac', money(full)); set('o_paid', money(paid));
  const pay = ok(mgp) && mgp > 0 ? full / mgp : NaN, ratio = ok(ltv) && ltv > 0 && full > 0 ? ltv / full : NaN;
  set('o_pay', ok(pay) ? fnum(pay, 1) + ' months' : '-');
  set('o_ratio', ok(ratio) ? fnum(ratio, 1) + ' : 1' : '-');
  set('o_max', ok(ltv) && ltv > 0 ? money(ltv / 3) : '-');
  set('o_v', ok(ratio) ? (ratio < 1 ? 'Each customer costs more than they are worth. Fix CAC or retention before scaling.' : ratio < 3 ? 'Below the 3:1 benchmark - profitable but thin.' : ratio > 5 ? 'Above 5:1 - you can probably afford to spend more on growth.' : 'Healthy 3-5:1 ratio.')
    : ok(pay) ? 'It takes ' + fnum(pay, 1) + ' months of gross profit to earn back what you paid for a customer.' : 'Add monthly gross profit or LTV to see payback and LTV:CAC.');
});</script>

if(window.ResizeObserver)new ResizeObserver(post).observe(document.body);window.addEventListener('load',post);post();})();</script>
</body></html>
